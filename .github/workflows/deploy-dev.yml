name: Deploy Dev

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      analytics: ${{ steps.filter.outputs.analytics }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Detect analytics-relevant changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "analytics=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(analytics|shared|metadata)/'; then
            echo "analytics=true" >> "$GITHUB_OUTPUT"
          else
            echo "analytics=false" >> "$GITHUB_OUTPUT"
          fi

  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # `npm test` runs every scripts/*.test.mjs guard plus the tenant-scope and
      # time-format audits (see package.json), so it supersedes running one audit
      # alone. Without this, scripts/secrets-sync.test.mjs would only ever pass on
      # a developer's machine and could not block a deploy — which is the failure
      # mode it exists to catch. No `npm ci`: these scripts have no dependencies.
      - name: Repo audits and script tests
        run: npm test

  sync-secrets:
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      # Sync every module's secrets on every deploy (never skip on unchanged
      # .secrets.json — that file lists secret *names*, so a rotated *value* in
      # GitHub would silently not propagate). To stay under the Cloudflare API
      # rate limit (error 10429) on the secrets-bulk write endpoint, run the
      # modules one at a time; combined with the retry/backoff in
      # sync-secrets.sh this keeps write bursts minimal without ever skipping.
      max-parallel: 1
      matrix:
        include:
          - module: web
            config: web/wrangler.toml
          - module: link
            config: link/wrangler.toml
          - module: flow
            config: flow/wrangler.toml
          - module: admin
            config: admin/wrangler.toml
          - module: insight-segment
            config: insight-segment/wrangler.toml
          - module: trend-skill
            config: trend-skill/wrangler.toml
          - module: content
            config: content/wrangler.toml
          - module: analytics
            config: analytics/wrangler.toml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm ci

      - name: Sync secrets
        run: ./scripts/sync-secrets.sh dev ${{ matrix.module }} ${{ matrix.config }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          CF_D1_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          # Repository-level secret (like CF_API_TOKEN): one R2 Data Catalog token shared by
          # dev and production. Read by the analytics worker for R2 SQL queries AND by the
          # PyIceberg compactor, so it needs Admin Read & Write, not Read only.
          R2_CATALOG_TOKEN: ${{ secrets.R2_CATALOG_TOKEN }}

  migrate:
    needs: [sync-secrets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: uniscrm-web-dev
            config: web/wrangler.toml
          - db: uniscrm-link-dev
            config: link/wrangler.toml
          - db: uniscrm-flow-dev
            config: flow/wrangler.toml
          - db: uniscrm-admin-dev
            config: admin/wrangler.toml
          - db: uniscrm-analytics-dev
            config: analytics/wrangler.toml
          - db: uniscrm-web-dev
            config: insight-segment/wrangler.toml
          - db: uniscrm-web-dev
            config: trend-skill/wrangler.toml
          - db: uniscrm-content-dev
            config: content/wrangler.toml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm ci

      - name: Run migrations
        run: npx wrangler d1 migrations apply ${{ matrix.db }} --env dev --config ${{ matrix.config }} --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  migrate-tenant-dbs:
    # Must run after `migrate`, not just sync-secrets: `migrate` applies the web DB migrations
    # (incl. 0009, which adds/backfills the tenants.d1_database_id column this job reads to find
    # which tenants have a provisioned DB). Racing ahead of it can read that column mid-migration
    # — empty or NULL — and silently treat "no tenants" as a successful no-op run.
    needs: [sync-secrets, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm ci

      - name: Install operation dependencies
        run: cd operation && npm ci

      - name: Migrate tenant DBs
        run: node --experimental-strip-types operation/migrate-tenant-dbs.ts dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}


  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 棘轮：只列当前 typecheck 干净的模块，清一个加一个。截至 2026-08-01 剩余错误数
        # 为 web=20、link=20、insight-segment=3、content=1、flow=1，都是各模块自身的既有
        # 问题（不是 shared/ 的），清掉后就把模块名加进这个列表。
        module: [admin, analytics]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # shared/frontend/* 的 React 类型从仓库根解析（@types/react 只装在根一份，与已在
      # 根的 @radix-ui/* 同一模式），所以根依赖必须先装，否则模块内 tsc 找不到 React 类型。
      - name: Install shared dependencies
        run: npm ci

      - name: Install module dependencies
        run: cd ${{ matrix.module }} && npm ci

      - name: Typecheck
        run: cd ${{ matrix.module }} && npm run typecheck


  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [web, link, flow, admin, analytics, content, insight-segment, trend-skill, operation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # shared/ 下的依赖从仓库根解析，模块测试 import 到它们时需要根依赖在位。
      - name: Install shared dependencies
        run: npm ci

      - name: Install module dependencies
        run: cd ${{ matrix.module }} && npm ci

      # link / flow / content 的 wrangler.toml 里有 AI binding，@cloudflare/vitest-pool-workers
      # 会为此建立 remote proxy session —— 没有凭据时这些模块的测试根本起不来（本地实测：
      # "Failed to start the remote proxy session"）。其余模块不需要，多给也无害。
      # 副作用是这三个模块的测试依赖网络，Cloudflare 侧抖动（曾见 521/522）会让本 job 变红；
      # 若日后证实不稳，把它们从这个 matrix 拆成单独的非阻塞 job。
      # 用 --dangerouslyIgnoreUnhandledErrors 而不是裸 npm test：web 与 link 的
      # @cloudflare/vitest-pool-workers 在收尾时稳定抛 "Worker cloudflare-pool emitted
      # error"（miniflare/workerd 的关闭竞态，与被测代码无关），vitest 会因此在用例
      # 全绿的情况下仍然退出 1 —— 不加这个 flag，这道门禁会让每一次部署都失败。
      # 已验证该 flag 不会让门禁失效：往 link 里塞一个必失败的用例，仍然退出 1。
      # mkdir dist：dist 被 gitignore，CI checkout 后不存在。analytics 的旧版
      # defineWorkersConfig（vitest-pool-workers 内嵌 wrangler）会因 wrangler.toml
      # 顶层 [assets] 的 directory 不存在直接抛错（flow/admin 用新 cloudflareTest 插件
      # 没这个问题）。wrangler 只要求目录存在，空目录即可；对没有 assets 的模块无害。
      - name: Test
        run: mkdir -p ${{ matrix.module }}/dist && cd ${{ matrix.module }} && npx vitest run --dangerouslyIgnoreUnhandledErrors
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy:
    needs: [migrate, migrate-tenant-dbs, changes, audits, typecheck, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [web, link, flow, admin, analytics, insight-segment, trend-skill, content]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install shared dependencies
        if: matrix.module != 'analytics' || needs.changes.outputs.analytics == 'true'
        run: npm ci

      - name: Install module dependencies
        if: matrix.module != 'analytics' || needs.changes.outputs.analytics == 'true'
        run: |
          if [ -f "${{ matrix.module }}/package-lock.json" ]; then
            cd ${{ matrix.module }} && npm ci
          fi

      - name: Build frontend
        if: matrix.module != 'analytics' || needs.changes.outputs.analytics == 'true'
        run: |
          if [ -f "${{ matrix.module }}/vite.config.ts" ]; then
            cd ${{ matrix.module }} && npx vite build
          fi

      - name: Cache pyarrow wheel (analytics compactor)
        if: matrix.module == 'analytics' && needs.changes.outputs.analytics == 'true'
        uses: actions/cache@v4
        with:
          path: analytics/compactor/vendor/pyarrow-25.0.0-cp312-cp312-manylinux_2_28_x86_64.whl
          key: pyarrow-wheel-25.0.0-cp312-cp312-manylinux_2_28_x86_64

      - name: Download vendored pyarrow wheel (analytics compactor)
        if: matrix.module == 'analytics' && needs.changes.outputs.analytics == 'true'
        run: |
          mkdir -p analytics/compactor/vendor
          if [ ! -f analytics/compactor/vendor/pyarrow-25.0.0-cp312-cp312-manylinux_2_28_x86_64.whl ]; then
            curl -L --fail -o analytics/compactor/vendor/pyarrow-25.0.0-cp312-cp312-manylinux_2_28_x86_64.whl \
              https://files.pythonhosted.org/packages/55/0e/cd705c042bc4fe7022478db577fcab4abdcfabb9bc37ab7a75556b3fcb2b/pyarrow-25.0.0-cp312-cp312-manylinux_2_28_x86_64.whl
          fi

      - name: Deploy
        if: matrix.module != 'analytics' || needs.changes.outputs.analytics == 'true'
        run: npx wrangler deploy --env dev --config ${{ matrix.module }}/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  setup-stripe:
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm ci

      - name: Setup Stripe
        run: ./scripts/setup-stripe.sh dev
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  e2e:
    needs: [deploy, setup-stripe]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm ci

      - name: Seed test data
        run: ./scripts/seed-e2e.sh dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          E2E_ENV: dev

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Print external config on failure
        if: failure()
        run: |
          echo "📋 Check external platform configuration:"
          cat EXTERNAL_CONFIG.md
